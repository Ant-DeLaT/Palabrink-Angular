<section>
  <form class="auth-form" [formGroup]="profileForm" (ngSubmit)="onSubmit()">
    <div class="row">
      <mat-form-field class="col">
        <mat-label>Correo electrónico</mat-label>
        <input matInput type="text" formControlName="email" />
      </mat-form-field>

      <mat-form-field class="col">
        <mat-label>Nombre de usuario</mat-label>
        <input matInput type="text" formControlName="name" />

        @let userErrors = formService.invalid(profileForm, 'name');
        <mat-error>
          @if (userErrors?.['required']) {
            <span>Este campo no puede estar vacío.</span>
          } @else if (userErrors?.['pattern']) {
            <span>No se permiten símbolos en este campo.</span>
          }
        </mat-error>
      </mat-form-field>
    </div>
    <!-- <mat-form-field> -->
    <!-- <mat-label>Imagen de perfil</mat-label> -->
    <!-- <input matInput type="text" formControlName="profileImg" /> -->
    <app-image-uploader (urlEmitter)="getImageUrl($event)"> </app-image-uploader>

    <!-- @if (formService.invalid(profileForm, 'profileImg')) {
      <mat-error> No es un correo válido</mat-error>
      } -->
    <!-- </mat-form-field> -->

    <button matButton="" type="button" (click)="openChangePsswd()">Modificar contraseña</button>
    <button matButton="filled" [disabled]="profileForm.invalid" type="submit">
      Guardar cambios
    </button>
    <button matButton="" class="redBtn" type="button">Borrar cuenta</button>
  </form>
</section>
