<form class="dialog-form" [formGroup]="confirmPasswordDialogForm" (ngSubmit)="onSubmit()">
  <mat-form-field>
    <mat-label>Confirma tu contraseña</mat-label>
    <input matInput [type]="isPasswordHidden() ? 'password' : 'text'" formControlName="password" />
    <button
      mat-icon-button
      matSuffix
      type="button"
      [attr.aria-label]="'Hide password'"
      [attr.aria-pressed]="isPasswordHidden()"
      (click)="hidePassword()"
    >
      <mat-icon>{{ isPasswordHidden() ? 'visibility_off' : 'visibility' }}</mat-icon>
    </button>
    @if (formService.invalid(confirmPasswordDialogForm, 'password')) {
      <mat-error> {{ confirmPasswordDialogForm.get('password')?.getError('authError') }}</mat-error>
    }
  </mat-form-field>

  <mat-dialog-actions class="row gap-2">
    <button class="col" matButton="" type="" mat-dialog-close="" (click)="closeDialog()">
      Cancelar
    </button>
    <button
      class="col"
      matButton="filled"
      type="submit"
      [disabled]="confirmPasswordDialogForm.invalid"
    >
      Verificar
    </button>
  </mat-dialog-actions>
</form>
