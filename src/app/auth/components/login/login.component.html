<section>
  <div class="login-card">
    <form class="auth-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field>
        <mat-label>Nombre de usuario</mat-label>
        <input id="loginUser" matInput type="text" formControlName="email" />

        @if (formService.invalid(loginForm, 'email')) {
        <mat-error> Error de prueba</mat-error>
        }
      </mat-form-field>

      <mat-form-field>
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" id="loginPassword" formControlName="password" />
      </mat-form-field>
      <small><a href="reset-password">¿Has olvidado tu contraseña?</a></small>
      <button matButton="filled" type="submit">Login</button>
      <small><a href="register">¿No has creado una cuenta?</a></small>
    </form>
  </div>
</section>
