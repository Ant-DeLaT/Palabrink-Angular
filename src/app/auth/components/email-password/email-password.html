<section>
  <form class="auth-form" [formGroup]="emailPasswordForm" (ngSubmit)="onSubmit()">
    <mat-form-field>
      <mat-label>Introduzca su correo</mat-label>
      <input matInput type="email" formControlName="email" />

      @let emailErrors = formService.invalid(emailPasswordForm, 'email');
      <mat-error>
        @if (emailErrors?.['required']) {
          <span>Este campo no puede estar vacío.</span>
        } @else if (emailErrors?.['email']) {
          <span>No se reconoce como un email válido.</span>
        }
      </mat-error>
    </mat-form-field>
    <button matButton="filled" [disabled]="emailPasswordForm.invalid" type="submit">
      Reiniciar contraseña
    </button>
    <button matButton="" type="button"><a href="/">Volver</a></button>
  </form>
</section>
