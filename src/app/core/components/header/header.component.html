<header>
  <img
    class="menu_icon"
    src="images/palabrink-imagen-rellena.png"
    alt="LogoPalabrink"
    (click)="sideBarService.toggleSideBar()"
  />

  <h1 class="title">{{ titleService.title() }}</h1>
  <!-- IconoPerfil.ico -->

  <button matButton [matMenuTriggerFor]="menu" class="profile_btn">
    <img [src]="selectedUserImage()" alt="Perfil" />
  </button>
  <mat-menu #menu="matMenu">
    @if (firebaseCnUsers.selectedUser()) {
      <button mat-menu-item (click)="goTo('profile')">
        Hola, {{ firebaseCnUsers.selectedUser()!.displayName }}
      </button>
      <button mat-menu-item (click)="firebaseCnUsers.logout()">Logout</button>
    } @else {
      <p>No estás conectado</p>
      <button mat-menu-item (click)="goTo('login')">Login</button>
    }
  </mat-menu>

  <!-- <a class="profile_btn" href="#"><img src="images/IconoPerfilXS.png" alt="Perfil" /></a> -->
</header>
