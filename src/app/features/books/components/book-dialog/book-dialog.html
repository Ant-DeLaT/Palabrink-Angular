<div class="dialog-container" [style.backgroundImage]="'url(' + book.cover_url + ')'">
  <h2 mat-dialog-title>{{ book.title }}</h2>
  <mat-dialog-content>
    <p class="author">{{ book.author }}</p>
    <p class="description">{{ book.description }}</p>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton="tonal" cdkFocusInitial mat-dialog-close="Test: Modal cerrado">Cerrar</button>
    <button matButton="filled" (click)="more()">Ver más</button>
  </mat-dialog-actions>
</div>
