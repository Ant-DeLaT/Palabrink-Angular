<div class="dialog-container">
  <h2 mat-dialog-title>{{ book.title }}</h2>
  <mat-dialog-content>
    <p>{{ book.author }}</p>
    <p>{{ book.description }}</p>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton="tonal" cdkFocusInitial mat-dialog-close="Test: Modal cerrado">Cerrar</button>
    <button matButton="filled" (click)="more()">Ver más</button>
  </mat-dialog-actions>
</div>
